<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <title>OG image template</title>
    <!-- Source for public/og.png (1200×630). Rendered by tools/render-images.mjs. -->
    <link rel="stylesheet" href="../src/app/globals.css" />
    <style>
      /* In the app next/font provides these; this file loads the same files directly. */
      @font-face {
        font-family: 'Geist';
        src: url('../src/app/fonts/geist-latin-wght-normal.woff2') format('woff2');
        font-weight: 100 900;
      }
      @font-face {
        font-family: 'Geist Mono';
        src: url('../src/app/fonts/geist-mono-latin-wght-normal.woff2') format('woff2');
        font-weight: 100 900;
      }
      :root {
        --font-sans-face: 'Geist';
        --font-mono-face: 'Geist Mono';
      }
    </style>
    <style>
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: var(--bg);
      }
      /* Text only, like the page: the claim, the category and the address. */
      .og {
        width: 1200px;
        height: 630px;
        padding: 72px 84px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .og .brand__mark {
        width: 52px;
        height: 52px;
      }
      .og .brand__name {
        font-size: 34px;
      }
      .og h1 {
        margin: 0;
        max-width: 15ch;
        font-size: 88px;
        font-weight: 600;
        line-height: 1.02;
        letter-spacing: -0.045em;
      }
      .og .foot {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        font-size: 24px;
        color: var(--text-2);
      }
      .og .url {
        font-family: var(--font-mono);
        font-size: 20px;
        color: var(--text-3);
      }
    </style>
  </head>
  <body>
    <div class="og">
      <span class="brand">
        <svg class="brand__mark" viewBox="0 0 32 32" aria-hidden="true">
          <rect width="32" height="32" rx="7.5" class="mark-bg" />
          <rect x="5.5" y="6.5" width="21" height="4.2" rx="2.1" class="mark-bar" />
          <rect x="5.5" y="13.9" width="13.2" height="4.2" rx="2.1" class="mark-bar" />
          <rect x="5.5" y="21.3" width="7.2" height="4.2" rx="2.1" class="mark-bar" />
          <path
            d="M23.2 13.6c0 0-4.2 5-4.2 8.4a4.2 4.2 0 0 0 8.4 0c0-3.4-4.2-8.4-4.2-8.4z"
            class="mark-drop"
          />
        </svg>
        <span class="brand__name">Dripmetric</span>
      </span>
      <h1>See where your signup funnel <span class="leak-word">leaks</span> revenue.</h1>
      <p class="foot">
        <span>Revenue-leak detection for self-serve SaaS</span>
        <span class="url">dripmetric.com</span>
      </p>
    </div>
  </body>
</html>
